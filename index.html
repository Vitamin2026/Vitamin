<script>
    async function loadLiveCalendar() {
        const container = document.getElementById('calendar-container');
        
        try {
            const response = await fetch('https://vitamin-gules.vercel.app/api/calendar');
            if (!response.ok) throw new Error('데이터 로드 실패');
            
            const data = await response.json();
            container.innerHTML = '';

            // 현재 시간 기준 (2026년 8월 기준)
            const now = new Date();

            // 오늘 이후(또는 현재 진행 중인) 이벤트만 필터링
            const upcomingEvents = data.filter(item => {
                const eventDate = new Date(item.date);
                return eventDate >= now;
            });

            if (!upcomingEvents || upcomingEvents.length === 0) {
                container.innerHTML = '<p style="text-align: center;">현재 예정된 다가오는 경제 이벤트가 없습니다.</p>';
                return;
            }

            upcomingEvents.forEach(item => {
                const eventDate = new Date(item.date);
                
                const kstOptions = { 
                    timeZone: 'Asia/Seoul', 
                    year: 'numeric', 
                    month: '2-digit', 
                    day: '2-digit', 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                };
                const kstTimeString = eventDate.toLocaleString('ko-KR', kstOptions);

                let borderColor = '#3498db';
                if (item.impact === 'High') borderColor = '#e74c3c';
                else if (item.impact === 'Medium') borderColor = '#f39c12';

                const card = document.createElement('div');
                card.className = 'event-card';
                card.style.borderLeftColor = borderColor;
                card.innerHTML = `
                    <div class="time">⏰ ${kstTimeString} (KST)</div>
                    <div class="title">[${item.country}] ${item.title}</div>
                    <div class="details">영향도: ${item.impact} | 예측: ${item.forecast || '발표 전'} | 이전: ${item.previous || '-'}</div>
                `;
                container.appendChild(card);
            });

        } catch (error) {
            container.innerHTML = `<p style="text-align: center; color: #e74c3c;">데이터를 불러오는 중 오류가 발생했습니다.<br>잠시 후 다시 시도해 주세요.</p>`;
        }
    }

    loadLiveCalendar();
</script>
