<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>트레이딩 일관성 계산기</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 30px; }
        .container { max-width: 520px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #444; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
        .hint { font-size: 12px; color: #777; margin-top: 4px; display: block; }
        button { width: 100%; background-color: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border-radius: 6px; font-size: 15px; line-height: 1.6; }
        .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎯 트레이딩 일관성 계산기</h2>
    
    <div class="input-group">
        <label>총 목표 수익 ($)</label>
        <input type="number" id="targetProfit" value="3000">
    </div>
    
    <div class="input-group">
        <label>일관성 제한 비율 (%)</label>
        <input type="number" id="consistencyLimit" value="50">
        <span class="hint">예: 50 입력 시, 하루 수익이 총 목표 수익의 50%를 초과할 수 없음</span>
    </div>
    
    <div class="input-group">
        <label>날짜별 일일 수익 입력 (쉼표로 구분)</label>
        <input type="text" id="dailyProfits" placeholder="예: 1800 또는 1000, 800">
        <span class="hint">거래한 날들의 수익금을 콤마(,)로 구분해서 적어주세요.</span>
    </div>

    <button onclick="calculateConsistency()">일관성 계산하기</button>

    <div id="resultBox" class="result" style="display:none;"></div>
</div>

<script>
function calculateConsistency() {
    const target = parseFloat(document.getElementById('targetProfit').value);
    const limitPercent = parseFloat(document.getElementById('consistencyLimit').value);
    const rawInput = document.getElementById('dailyProfits').value;
    
    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';

    if (isNaN(target) || isNaN(limitPercent) || !rawInput.trim()) {
        resultBox.className = 'result fail';
        resultBox.innerHTML = '⚠️ 모든 항목을 올바르게 입력해주세요.';
        return;
    }

    const profits = rawInput.split(',').map(item => parseFloat(item.trim())).filter(item => !isNaN(item));
    
    if (profits.length === 0) {
        resultBox.className = 'result fail';
        resultBox.innerHTML = '⚠️ 올바른 형식의 수익 데이터를 입력해주세요.';
        return;
    }

    const maxAllowedDayProfit = target * (limitPercent / 100);
    const totalProfit = profits.reduce((a, b) => a + b, 0);
    const maxDayProfit = Math.max(...profits);
    let remainingProfit = target - totalProfit;

    let html = `<b>📊 계산 결과 요약</b><hr>`;
    html += `• 총 달성 누적 수익: <b>$${totalProfit.toLocaleString()}</b> / 목표 $${target.toLocaleString()}<br>`;
    html += `• 일일 최대 허용 한도 (${limitPercent}%): <b>$${maxAllowedDayProfit.toLocaleString()}</b><br>`;
    html += `• 내가 기록한 최고 하루 수익: <b>$${maxDayProfit.toLocaleString()}</b><br>`;

    if (maxDayProfit > maxAllowedDayProfit) {
        const excessProfit = maxDayProfit - maxAllowedDayProfit; // 초과한 금액
        const penaltyProfit = excessProfit * 2; // 초과한 금액의 2배
        const adjustedRemaining = remainingProfit + penaltyProfit; // 페널티가 반영된 최종 남은 금액

        resultBox.className = 'result fail';
        html += `• 일관성 초과 금액: <b>$${excessProfit.toLocaleString()}</b><br>`;
        html += `• 초과 금액의 2배 페널티: <b>+$${penaltyProfit.toLocaleString()}</b><br>`;
        html += `• 페널티 반영된 최종 남은 금액: <b>$${adjustedRemaining > 0 ? adjustedRemaining.toLocaleString() : 0}</b><br><hr>`;
        html += `❌ <b>결과: 일관성 규칙 위반 (Failed)</b><br>최고 하루 수익이 허용 한도를 초과하여, 초과분의 2배($${penaltyProfit.toLocaleString()})가 추가 목표로 부과되었습니다.<br>(최종 채워야 할 남은 금액: $${adjustedRemaining > 0 ? adjustedRemaining.toLocaleString() : 0})`;
    } else if (totalProfit < target) {
        resultBox.className = 'result info';
        html += `• 목표까지 남은 금액: <b>$${remainingProfit.toLocaleString()}</b><br><hr>`;
        html += `⏳ <b>결과: 진행 중 (In Progress)</b><br>현재까지 일관성 규칙은 안전하며, 목표까지 $${remainingProfit.toLocaleString()} 남았습니다.`;
    } else {
        resultBox.className = 'result pass';
        html += `• 목표까지 남은 금액: <b>$0</b><br><hr>`;
        html += `🎉 <b>결과: 일관성 통과 성공 (Passed)</b><br>목표 수익 달성과 일관성 규칙을 모두 충족했습니다!`;
    }

    resultBox.innerHTML = html;
}
</script>

</body>
</html>
